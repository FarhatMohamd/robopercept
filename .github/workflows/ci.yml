name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1
          pip install -e ".[dev,onnx]"
      - name: Tests
        run: pytest --cov=robopercept --cov-report=term-missing
      - name: Simulator benchmark
        run: |
          robopercept eval --scenario urban --frames 900
          robopercept eval --scenario warehouse --frames 780
          robopercept bench -c urban --frames 300

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build -f docker/Dockerfile -t robopercept:ci .
      - name: Smoke test
        run: docker run --rm robopercept:ci eval --scenario urban --frames 120

  ros2:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Build the ROS 2 package
        shell: bash
        run: |
          apt-get update && apt-get install -y python3-pip ros-jazzy-vision-msgs ros-jazzy-cv-bridge
          pip install --break-system-packages -e .
          cd ros2_ws && source /opt/ros/jazzy/setup.bash && colcon build --symlink-install
