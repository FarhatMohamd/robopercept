# Built-in urban driving scenario: runs anywhere, no GPU, no weights.
source:
  uri: synthetic:urban
  fps: 30
detector:
  backend: synthetic
  conf: 0.25
tracker:
  camera_motion_compensation: false
safety:
  profile: vehicle
  ego_speed_mps: 10.0
  corridor_half_width_m: 1.3
lanes:
  enabled: true
output:
  draw_bev: true
server:
  enabled: true
  port: 8080
