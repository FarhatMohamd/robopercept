[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robopercept"
version = "1.0.0"
description = "Real-time object detection, tracking, monocular ranging and collision risk for autonomous robots and vehicles"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "FARHAT Mohamad" }]
requires-python = ">=3.10"
keywords = ["object detection", "tracking", "autonomous driving", "robotics", "YOLO", "ByteTrack", "ROS 2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "scipy>=1.10",
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.4.0"]
onnx = ["onnxruntime>=1.17"]
onnx-gpu = ["onnxruntime-gpu>=1.17"]
rfdetr = ["rfdetr>=1.2"]
depth = ["transformers>=4.45", "torch>=2.2", "pillow>=10"]
mqtt = ["paho-mqtt>=2.0"]
carla = ["carla>=0.9.15"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
all = ["robopercept[yolo,onnx,depth,mqtt]"]

[project.scripts]
robopercept = "robopercept.cli:main"

[project.urls]
Homepage = "https://github.com/FarhatMohamd/robopercept"
Issues = "https://github.com/FarhatMohamd/robopercept/issues"

[tool.setuptools.packages.find]
include = ["robopercept*"]

[tool.setuptools.package-data]
robopercept = ["presets/*.yaml", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["ros2_ws/build", "ros2_ws/install"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["B008", "B905", "N806", "N803", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
